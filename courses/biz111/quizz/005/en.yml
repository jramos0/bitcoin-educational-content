question: What do legal tender laws enforce?
answer: The coercion of the acceptance of pre-defined form of money within a jurisdiction
wrong_answers:
- The choice of citizens to accept any form of money for their economic interactions
- The coercion of saving uniquely in money recognized as legal tender within a jurisdiction
- The choice of commercial banks to refuse some forms of money
explanation: |
  Legal tender laws pre-defined what forms of money must be accepted for economic interaction within a jurisdiction, especially for economic interaction with governmental institutions
