question: What is the economic incentive for governments to choose fiat money as legal tender?
answer: It gives them the possibility to change the monetary policy at their will
wrong_answers:
- It gives them the possibility to easily capture citizen's savings
- It gives them the possibility to avoid any illegal economic interactions
- It gives them the possibility to provide resilient monetary infrastructure
explanation: |
  Having the power to be the solely issuer of the currency is an advantage as it allows to adapt the production of money based on governmental needs at the expense of the individuals
