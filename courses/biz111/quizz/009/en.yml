question: What is seigniorage?
answer: The profit made by issuing currency at a higher value than the cost of producing it
wrong_answers:
- The tax collected from the citizens for the production of goods
- The benefice made by the Central Bank by financing Commercial Banks
- The ability to issue debt at no cost
explanation: |
  The seigniorage is source of revenue for any government that can issue its own currency, as it increases their own purchasing power at the expense of individual purchasing power. It is often describe as an inflation tax on the public
