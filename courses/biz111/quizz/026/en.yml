question: What should be the main concern when choosing a Bitcoin wallet, in terms of self-custody?
answer: Are you the owner of the funds?
wrong_answers:
  - Is the wallet secured with a passphrase?
  - Does the wallet allow receiving and sending bitcoins?
  - Can you share your wallet with another person?
explanation: |
  When choosing a Bitcoin wallet, you should ask yourself if
  it will allow you to be the sole owner of the funds, or will it give control over
  your money to a third party? Always remember that the holder of
  the private key is the owner of the bitcoins
