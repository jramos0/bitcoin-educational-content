question: When transitioning to a new career/role, what should you do if you still lack expertise in your target field?
answer: Quote and echo others' insights
wrong_answers:
  - Pretend to be an expert
  - Only share original content
  - Wait until you gain more experience
explanation: |
  Quoting and echoing others' insights demonstrates that you are learning and engaging with the field, while also acknowledging the expertise of others
