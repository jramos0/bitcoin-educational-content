question: What is the foundational principle of the Austrian School of Economics?
answer: Human Action
wrong_answers:
  - Spontaneous Order
  - Subjective Value Theory
  - Time Preference
explanation: |-
  Human Action is the central concept of Austrian Economics, as formalized by Ludwig von Mises in his book of the same name. It establishes that economics is fundamentally about purposeful human choices and behavior. While spontaneous order, subjective value theory, and time preference are important Austrian concepts, they all derive from the more fundamental principle of purposeful human action
