question: Why were patterns, ridges, or "reeding" added to the edges of silver and gold coins through history?
answer: To prevent clipping by ensuring that edge tampering was immediately visible
wrong_answers:
  - To strengthen the structural integrity of the coin during the minting process
  - To distinguish different denominations by tactile features
  - To display the mint's signature craftsmanship and authenticity
explanation: |-
  Reeded edges were specifically designed as an anti-counterfeiting measure to prevent "clipping" - the practice of shaving small amounts of precious metal from the edges of coins for profit. The ridged pattern made it immediately obvious if someone had tampered with the edge of the coin, protecting the coin's actual metal content and value
