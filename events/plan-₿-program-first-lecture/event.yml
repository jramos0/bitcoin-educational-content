name: Plan ₿ Program First Lecture
type: lecture
description: "This event marks the first public lecture of the Plan ₿ Program,
  hosted in El Zonte at Bitcoin Beach.\r

  \r

  Giacomo Zucco and Rogzy will introduce the Plan ₿ Program 2026, the evolution
  of Plan ₿ Biz School and Plan ₿ Tech School, now running two tracks in
  parallel: the Business Track and the Developer Track. They will explain how
  the program is structured, who each track is designed for, and how it prepares
  participants to enter and operate professionally within the Bitcoin
  industry.\r

  \r

  The session is open to locals, visitors, educators, builders, and current
  enrolled students, as well as anyone curious about Bitcoin beyond speculation.
  The focus will be on real-world pathways, practical skills, and how Bitcoin
  education translates into meaningful work and long-term impact."
