description: Es un emprendimiento salvadoreño de café móvil que ofrece la mejor
  calidad del café salvadoreño, destacándose por su innovación al permitirte
  pagar tu café utilizando Bitcoin a través de la Lightning Network. Nuestro
  objetivo es llevar el sabor único del “Bitcoin Country” a todos los rincones,
  combinando la pasión por el café con la experiencia de usar Bitcoin como medio
  de intercambio, facilitando una manera moderna y accesible de disfrutar el
  mejor café de El Salvador.
